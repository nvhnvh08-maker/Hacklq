<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TRBAO MOD · Share Map</title>
  <link rel="stylesheet" href="./home.css?v=3">
  <style>
    /* Embed nguyên bản home.css từ yong38 để không bao giờ bị vỡ style */
    :root{--bg:#0f151d;--card:#1a2330;--fg:#eaf1fb;--sub:#9fb0c4;--accent:#22d3ee;--border:#2b3a4d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
    .home{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    h1{font-size:20px;margin:0 0 8px;font-weight:700}
    p{color:var(--sub);font-size:13px;margin:0 0 18px}
    p b{color:var(--fg)}
    .code-form{display:flex;flex-direction:column;gap:12px}
    .code-input{background:#0e141c;border:1px solid var(--border);border-radius:12px;color:var(--fg);font:800 26px ui-monospace,Menlo,monospace;text-align:center;letter-spacing:10px;text-transform:uppercase;padding:14px;outline:none}
    .code-input::placeholder{color:#3c4b5e;letter-spacing:10px}
    .code-input:focus{border-color:var(--accent)}
    .code-btn{background:var(--accent);color:#06232a;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;transition:all .15s}
    .code-btn:active{filter:brightness(.95);transform:scale(0.99)}
    .demo-btn{background:transparent;border:1px dashed var(--accent);color:var(--accent);border-radius:12px;padding:12px;font-weight:700;font-size:13px;cursor:pointer;margin-top:4px;transition:all .15s}
    .demo-btn:active{background:rgba(34,211,238,0.1)}
    .home-err{display:none;margin:14px 0 0;padding:10px 12px;border-radius:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.5);color:#ff8f8f;font-size:13px;font-weight:600}
    .home-err.show{display:block}
    .hint{margin:16px 0 0;font-size:12px}
  </style>
</head>
<body>
  <main class="home">
    <h1>TRBAO MOD · Share Map</h1>
    <p>Nhập <b>mã 6 ký tự</b> của trận để xem trực tiếp.</p>
    <form class="code-form" action="./viewer.html" method="get" autocomplete="off">
      <input class="code-input" id="codeInput" name="code" maxlength="6" placeholder="A3F9K2" required spellcheck="false" autocapitalize="characters" inputmode="text" autofocus>
      <button class="code-btn" id="submitBtn" type="submit">Xem trận</button>
      <button class="demo-btn" id="demoBtn" type="button">🎯 Xem trận mẫu (Mã: TEST88)</button>
    </form>
    <div id="homeErr" class="home-err" role="alert"></div>
    <p class="hint">Mã hiện trong app khi bật <b>"Chia Sẻ Map"</b> (by trbaomod).</p>
  </main>
  <script src="./home.js?v=3"></script>
</body>
</html>
