<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TRBAO MOD · Share Map Viewer</title>
    <link rel="preload" href="./assets/minimap.png" as="image">
    <link rel="stylesheet" href="./dist/styles.min.css?v=3">
    <style>
      /* Embed nguyên bản styles.min.css từ yong38 */
      *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0f151d;color:#edf2e8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.viewer-shell{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:100%;padding:16px;gap:12px}.topbar{align-items:center;display:flex;justify-content:space-between;gap:16px;width:100%}.topbar-actions{align-items:center;display:flex;flex:0 0 auto;gap:8px}h1,p{margin:0}h1{font-size:20px;font-weight:700}p{color:#aeb9a9;font-size:13px;margin-top:2px}button,input,select{border:1px solid #41546a;border-radius:6px;background:#172231;color:#edf2e8;font:inherit;min-height:32px}button{cursor:pointer;padding:6px 9px}button:hover{background:#223249}button[data-active=true]{border-color:#f3d369;color:#ffe28a}.pip-button[data-active=true]{border-color:#63c174;color:#9cf0a6}select{padding:5px 8px}input{min-width:0;padding:5px 8px;width:100%}.status{border:1px solid #546055;border-radius:999px;color:#dbe7d5;flex:0 0 auto;font-size:13px;padding:6px 10px}.status[data-state=live]{border-color:#63c174;color:#9cf0a6}.status[data-state=waiting],.status[data-state=connecting]{border-color:#c7a84b;color:#f1d77a}.status[data-state=offline],.status[data-state=error]{border-color:#c95f5f;color:#ff9a9a}canvas{align-self:center;aspect-ratio:1;background:#101923;border:1px solid #26374a;border-radius:8px;display:block;height:min(calc(100vw - 32px),calc(100vh - 92px),1100px);justify-self:center;max-height:1100px;max-width:calc(100vw - 32px);min-height:0;width:min(calc(100vw - 32px),calc(100vh - 92px),1100px)}canvas[data-anchor-capture=true]{cursor:crosshair}.pip-video{height:1px;opacity:0;pointer-events:none;position:fixed;right:0;top:0;width:1px}.calibration-panel{background:#0d141df0;border:1px solid #31445a;border-radius:8px;box-shadow:0 18px 48px #00000059;color:#edf2e8;display:grid;gap:12px;max-height:calc(100vh - 32px);overflow:auto;padding:12px;position:fixed;right:16px;top:16px;width:min(360px,calc(100vw - 32px));z-index:10}.calibration-panel[hidden]{display:none}.calibration-header,.calibration-row{align-items:center;display:flex;gap:8px;justify-content:space-between}.calibration-header h2{font-size:16px;margin:0}.calibration-group{display:grid;gap:7px}.calibration-group span,.calibration-row label{color:#b9c5d2;font-size:12px;font-weight:700;text-transform:uppercase}.calibration-note{color:#c9d5df;font-size:12px;line-height:1.35}.calibration-pad{display:grid;gap:6px;grid-template-columns:repeat(3,1fr)}.calibration-pad button:first-child{grid-column:2}.calibration-pad button:nth-child(2){grid-column:1}.calibration-pad button:nth-child(3){grid-column:3}.calibration-pad button:nth-child(4){grid-column:2}.calibration-buttons{display:grid;gap:6px;grid-template-columns:repeat(4,minmax(0,1fr))}.calibration-scale-inputs{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}.calibration-scale-inputs label{color:#b9c5d2;display:grid;font-size:12px;font-weight:700;gap:4px}#calibrationOutput{background:#09111b;border:1px solid #26384d;border-radius:6px;color:#cfe4ff;font-size:12px;line-height:1.45;margin:0;overflow:auto;padding:8px;white-space:pre-wrap}@media(max-width:720px){.calibration-panel{inset:auto 12px 12px;width:auto}.calibration-buttons{grid-template-columns:repeat(2,minmax(0,1fr))}}
    </style>
  </head>
  <body>
    <main class="viewer-shell">
      <header class="topbar">
        <div>
          <h1>TRBAO MOD · Share Map</h1>
          <p id="sessionLabel">Đang tải bản đồ...</p>
        </div>
        <div class="topbar-actions">
          <a href="./index.html" class="status" style="text-decoration:none;cursor:pointer">← Thoát</a>
          <button id="pipButton" class="pip-button" type="button" hidden>PiP</button>
          <div id="status" class="status" data-state="connecting">Connecting</div>
        </div>
      </header>
      <canvas id="map" width="960" height="640" aria-label="Shared minimap"></canvas>
      <video id="pipVideo" class="pip-video" muted playsinline aria-hidden="true"></video>
      <section id="calibrationPanel" class="calibration-panel" hidden>
        <div class="calibration-header">
          <div>
            <h2>Calibration</h2>
            <p>Debug mode only</p>
          </div>
          <button type="button" data-action="copy">Copy config</button>
        </div>
        <div class="calibration-row">
          <label for="stepSize">Step</label>
          <select id="stepSize">
            <option value="0.001">Fine</option>
            <option value="0.005" selected>Normal</option>
            <option value="0.02">Large</option>
          </select>
          <button type="button" data-action="reset">Reset</button>
        </div>
        <div class="calibration-group">
          <span>Anchor calibration</span>
          <select id="anchorPlayerSelect" aria-label="Anchor player"></select>
          <div class="calibration-buttons">
            <button type="button" data-action="anchor-toggle">Click map</button>
            <button type="button" data-action="anchor-undo">Undo</button>
            <button type="button" data-action="anchor-clear">Clear</button>
            <button type="button" data-action="anchor-copy">Copy anchors</button>
          </div>
          <p id="anchorStatus" class="calibration-note">Need 3 anchors</p>
        </div>
        <div class="calibration-group">
          <span>Move markers</span>
          <div class="calibration-pad">
            <button type="button" data-adjust="offsetY:-1">Up</button>
            <button type="button" data-adjust="offsetX:-1">Left</button>
            <button type="button" data-adjust="offsetX:1">Right</button>
            <button type="button" data-adjust="offsetY:1">Down</button>
          </div>
        </div>
        <div class="calibration-group">
          <span>Scale map image</span>
          <div class="calibration-buttons">
            <button type="button" data-adjust="imageScale:-1">Image -</button>
            <button type="button" data-adjust="imageScale:1">Image +</button>
          </div>
        </div>
        <div class="calibration-group">
          <span>Scale markers</span>
          <div class="calibration-scale-inputs">
            <label>
              X
              <input id="markerScaleX" type="number" min="0.0001" step="0.01" inputmode="decimal">
            </label>
            <label>
              Y
              <input id="markerScaleY" type="number" min="0.0001" step="0.01" inputmode="decimal">
            </label>
          </div>
          <div class="calibration-buttons">
            <button type="button" data-adjust="scaleX:-1">X -</button>
            <button type="button" data-adjust="scaleX:1">X +</button>
            <button type="button" data-adjust="scaleY:-1">Y -</button>
            <button type="button" data-adjust="scaleY:1">Y +</button>
            <button type="button" data-multiply="scaleX:0.5">X /2</button>
            <button type="button" data-multiply="scaleX:2">X x2</button>
            <button type="button" data-multiply="scaleY:0.5">Y /2</button>
            <button type="button" data-multiply="scaleY:2">Y x2</button>
          </div>
        </div>
        <div class="calibration-group">
          <span>Crop map area</span>
          <div class="calibration-buttons">
            <button type="button" data-adjust="left:1">Left in</button>
            <button type="button" data-adjust="left:-1">Left out</button>
            <button type="button" data-adjust="right:-1">Right in</button>
            <button type="button" data-adjust="right:1">Right out</button>
            <button type="button" data-adjust="top:1">Top in</button>
            <button type="button" data-adjust="top:-1">Top out</button>
            <button type="button" data-adjust="bottom:-1">Bottom in</button>
            <button type="button" data-adjust="bottom:1">Bottom out</button>
          </div>
        </div>
        <pre id="calibrationOutput"></pre>
      </section>
    </main>
    <script src="./dist/app.min.js?v=v8_minions"></script>
  </body>
</html>
